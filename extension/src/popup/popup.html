<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>n8n Copilot</title>
  <style>
    :root {
      --bg: #1f1f28;
      --bg-raised: #2a2a36;
      --text: #f0f0f5;
      --text-dim: #a8a8b8;
      --accent: #6e6ef5;
      --accent-hover: #7f7ff8;
      --ok: #3fb950;
      --error: #f85149;
      --border: #3a3a48;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .header .logo {
      font-size: 18px;
      line-height: 1;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--text-dim);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    input[type="text"] {
      width: 100%;
      background: var(--bg-raised);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 4px;
      font-size: 13px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .field {
      margin-bottom: 14px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .toggle-row .toggle-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .toggle-row .toggle-title {
      font-weight: 600;
    }

    .toggle-row .toggle-hint {
      color: var(--text-dim);
      font-size: 11px;
      line-height: 1.4;
    }

    .switch {
      position: relative;
      flex-shrink: 0;
      width: 34px;
      height: 20px;
      margin-left: 10px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .switch .slider {
      position: absolute;
      inset: 0;
      background: #47475a;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .switch .slider::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 14px;
      height: 14px;
      background: var(--text);
      border-radius: 50%;
      transition: transform 0.15s;
    }
    .switch input:checked + .slider {
      background: var(--accent);
    }
    .switch input:checked + .slider::before {
      transform: translateX(14px);
    }

    button#save {
      width: 100%;
      padding: 9px;
      cursor: pointer;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s;
    }
    button#save:hover {
      background: var(--accent-hover);
    }

    #status {
      margin-top: 8px;
      min-height: 14px;
      color: var(--text-dim);
      font-size: 12px;
    }

    #connection {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-weight: 600;
      font-size: 12px;
    }
    #connection .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
    }
    #connection.ok .dot {
      background: var(--ok);
    }
    #connection.ok {
      color: var(--ok);
    }
    #connection.error .dot {
      background: var(--error);
    }
    #connection.error {
      color: var(--error);
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🧭</span>
    <h1>n8n Copilot</h1>
  </div>

  <div class="field">
    <label for="apiBase">Backend API URL</label>
    <input id="apiBase" type="text" placeholder="http://localhost:8000" />
  </div>

  <div class="toggle-row">
    <div class="toggle-text">
      <span class="toggle-title">AI-enhanced suggestions</span>
      <span class="toggle-hint">Sharper results, adds a second network call per suggestion.</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="useLlm" />
      <span class="slider"></span>
    </label>
  </div>

  <button id="save">Save</button>
  <div id="status"></div>
  <div id="connection"><span class="dot"></span><span class="text"></span></div>

  <script src="popup.js"></script>
</body>
</html>
