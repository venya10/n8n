<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>n8n Copilot</title>
  <style>
    body { width: 260px; font-family: -apple-system, sans-serif; padding: 12px; font-size: 13px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin-bottom: 10px; }
    button { width: 100%; padding: 6px; cursor: pointer; }
    #status { margin-top: 8px; opacity: 0.7; }
    #connection { margin-top: 6px; font-weight: 600; }
    #connection.ok { color: #1a7f37; }
    #connection.error { color: #cf222e; }
  </style>
</head>
<body>
  <label for="apiBase">Backend API URL</label>
  <input id="apiBase" type="text" placeholder="http://localhost:8000" />
  <button id="save">Save</button>
  <div id="status"></div>
  <div id="connection"></div>
  <script src="popup.js"></script>
</body>
</html>
