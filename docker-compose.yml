services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Enables the optional LLM step (see backend/.env.example) if
    # backend/.env exists; `required: false` means a fresh clone without one
    # still runs fine — it just skips the HyDE query rewrite.
    env_file:
      - path: ./backend/.env
        required: false
